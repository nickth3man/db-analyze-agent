[package]
name = "nba-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
dotenvy = "0.15.7"
duckdb = { version = "1.10505.0", features = ["bundled", "r2d2"] }
futures = "0.3.33"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12.4"
r2d2 = "0.8.10"
sqlparser = { version = "0.54", features = ["visitor"] }
reqwest = { version = "0.12.15", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.7.0", features = ["fs", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.15.1", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
tempfile = "3"
