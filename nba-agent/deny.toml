# cargo-deny configuration for nba-agent
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Reject crates with known security vulnerabilities.
db-path = "../.cargo/advisory-deny.toml"
yanked = "warn"

[bans]
# Disallow multiple versions of the same crate; warn-only until baseline
# is established so the first run does not block CI.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
# Allow the canonical Rust ecosystem dual-license set plus permissive licenses
# encountered in the transitive dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# nba-agent is publish=false (unpublished binary), so it has no legally
# asserted license. Skip license checks for the private/unpublished crate
# itself while still enforcing the allowlist on every published dependency.
private = { ignore = true }

[sources]
# Require the registry source for all crates.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
